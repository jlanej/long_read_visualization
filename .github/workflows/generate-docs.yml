name: Generate Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Only one Pages deployment can run at a time; cancel any in-progress run
# so that each push to main always results in the freshest site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ── Build: run pipeline, capture screenshots, generate site ──────────────
  generate-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb chromium-browser
          pip install selenium Pillow

      - name: Build Docker image
        run: docker build -t long_read_visualization:docs .

      - name: Run toy dataset pipeline
        run: |
          mkdir -p /tmp/toy_output
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "${PWD}/resources/toy_dataset:/input:ro" \
            -v "/tmp/toy_output:/output" \
            long_read_visualization:docs \
            --hap1        /input/toy_hap1.fa.gz \
            --hap2        /input/toy_hap2.fa.gz \
            --cram        /input/toy_reads.bam \
            --reference   /input/toy_reference.fa.gz \
            --output-dir  /output \
            --threads     2 \
            --ont

      - name: Generate server config
        run: |
          RESOURCES="${PWD}/resources/toy_dataset"
          cat > /tmp/toy_output/samples.tsv <<EOF
          #sample_id	output_dir	reference	hap1_assembly	hap2_assembly	reads_bam	regions
          toy_reads	/tmp/toy_output	${RESOURCES}/toy_reference.fa.gz	${RESOURCES}/toy_hap1.fa.gz	${RESOURCES}/toy_hap2.fa.gz	${RESOURCES}/toy_reads.bam	${RESOURCES}/toy_manifest.json
          EOF

      - name: Start visualization server
        run: |
          python3 server/app.py \
            --config /tmp/toy_output/samples.tsv \
            --port 8080 &
          sleep 5

      - name: Capture screenshots
        run: |
          mkdir -p docs/screenshots
          python3 scripts/capture_screenshots.py \
            --url http://localhost:8080 \
            --output-dir docs/screenshots

      - name: Generate static documentation site
        run: python3 scripts/generate_docs.py

      - name: Upload screenshots as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: documentation-screenshots
          path: docs/screenshots/

      - name: Commit documentation (main branch only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "No documentation changes to commit"
          else
            git commit -m "docs: auto-generate static site with screenshots [skip ci]"
            git push
          fi

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

  # ── Deploy: publish the artifact to GitHub Pages ─────────────────────────
  deploy:
    needs: generate-docs
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
