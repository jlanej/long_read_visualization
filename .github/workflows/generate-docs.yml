name: Generate Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb chromium-browser
          pip install selenium Pillow

      - name: Build Docker image
        run: docker build -t long_read_visualization:docs .

      - name: Run toy dataset pipeline
        run: |
          mkdir -p /tmp/toy_output
          docker run --rm \
            -v "${PWD}/resources/toy_dataset:/input:ro" \
            -v "/tmp/toy_output:/output" \
            long_read_visualization:docs \
            bash -c "
              cd /output &&
              bash /opt/long_read_visualization/scripts/preprocess.sh \
                --sample toy_reads \
                --hap1 /input/toy_hap1.fa.gz \
                --hap2 /input/toy_hap2.fa.gz \
                --ref /input/toy_reference.fa.gz \
                --reads /input/toy_reads.bam \
                --output /output \
                --threads 2
            "

      - name: Generate server config
        run: |
          cat > /tmp/toy_output/samples.tsv <<'EOF'
          #sample_id	output_dir	reference	hap1_assembly	hap2_assembly	reads_bam	regions
          toy_reads	/tmp/toy_output	${PWD}/resources/toy_dataset/toy_reference.fa.gz	${PWD}/resources/toy_dataset/toy_hap1.fa.gz	${PWD}/resources/toy_dataset/toy_hap2.fa.gz	${PWD}/resources/toy_dataset/toy_reads.bam	${PWD}/resources/toy_dataset/toy_manifest.json
          EOF

      - name: Start visualization server
        run: |
          python3 server/app.py \
            --config /tmp/toy_output/samples.tsv \
            --port 8080 &
          sleep 5

      - name: Capture screenshots
        run: |
          mkdir -p docs/screenshots
          python3 scripts/capture_screenshots.py \
            --url http://localhost:8080 \
            --output-dir docs/screenshots

      - name: Generate documentation page
        run: python3 scripts/generate_docs.py

      - name: Upload screenshots as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: documentation-screenshots
          path: docs/screenshots/

      - name: Commit documentation (main branch only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "No documentation changes to commit"
          else
            git commit -m "docs: auto-generate documentation with screenshots [skip ci]"
            git push
          fi
