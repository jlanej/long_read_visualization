[package]
name = "lrv-native-viewer"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Native Rust GUI for multi-panel long-read genome visualization (egui + noodles)"
license = "MIT"

[dependencies]
# GUI framework
eframe = { version = "0.33", default-features = true }
egui = "0.33"

# Bioinformatics I/O
noodles = { version = "0.108", features = ["bam", "sam", "cram", "fasta", "bgzf", "core", "csi"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
log = "0.4"
env_logger = "0.11"

# Compression (for .mapping.json.gz)
flate2 = "1"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "lrv-viewer"
path = "src/main.rs"
