<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Long Read Visualization — Multi-Panel IGV.js</title>
<script src="/static/igv.min.js"></script>
<style>
    :root {
        --bg: #1a1a2e;
        --surface: #16213e;
        --surface2: #0f3460;
        --accent: #e94560;
        --text: #eee;
        --text-muted: #999;
        --border: #334;
        --panel-ref: #1b3a4b;
        --panel-hap1: #1b3a2b;
        --panel-hap2: #3a2b1b;
        --ref-panel-flex: 1.3;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
    }

    /* ── Header bar ──────────────────────────────────────────────────────── */
    .header {
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        padding: 8px 16px;
        display: flex;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
    }
    .header h1 {
        font-size: 16px;
        font-weight: 600;
        white-space: nowrap;
    }
    .header label {
        font-size: 13px;
        color: var(--text-muted);
    }
    .header select, .header input, .header button {
        font-size: 13px;
        padding: 4px 8px;
        border-radius: 4px;
        border: 1px solid var(--border);
        background: var(--surface2);
        color: var(--text);
    }
    .header select { min-width: 160px; max-width: 400px; }
    .header button {
        cursor: pointer;
        background: var(--accent);
        border-color: var(--accent);
        font-weight: 600;
    }
    .header button:hover { opacity: 0.85; }
    .header button:disabled { opacity: 0.4; cursor: default; }

    .spacer { flex: 1; }

    .nav-group {
        display: flex;
        align-items: center;
        gap: 6px;
    }
    .region-counter {
        font-size: 12px;
        color: var(--text-muted);
        min-width: 60px;
        text-align: center;
    }

    .sync-toggle {
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: 13px;
        cursor: pointer;
    }
    .sync-toggle input[type="checkbox"] {
        accent-color: var(--accent);
    }

    /* ── Toolbar buttons ────────────────────────────────────────────────── */
    .toolbar-group {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-left: 8px;
    }
    .toolbar-btn {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 12px;
        padding: 4px 10px;
        border-radius: 4px;
        border: 1px solid var(--border);
        background: var(--surface2);
        color: var(--text-muted);
        cursor: pointer;
        transition: background 0.15s, color 0.15s, border-color 0.15s;
        white-space: nowrap;
    }
    .toolbar-btn:hover {
        background: var(--surface);
        color: var(--text);
    }
    .toolbar-btn.active {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
    }
    .btn-icon { font-size: 13px; }

    /* ── Panel layout ────────────────────────────────────────────────────── */
    .panels {
        display: flex;
        flex-direction: column;
        gap: 1px;
        padding: 2px;
        height: calc(100vh - 48px);
    }
    .panel {
        flex: 1;
        border-radius: 4px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        min-height: 0;
    }
    .panel.ref { flex: var(--ref-panel-flex); background: var(--panel-ref); }
    .panel-header {
        padding: 2px 10px;
        font-size: 12px;
        font-weight: 600;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .panel-header .locus {
        font-size: 11px;
        font-weight: 400;
        color: var(--text-muted);
        font-family: monospace;
    }
    .panel-body {
        flex: 1;
        position: relative;
        min-height: 0;
        overflow: auto;
    }
    .panel-body > div {
        height: 100%;
    }
    .panel.ref .panel-header { background: rgba(27,58,75,0.8); }
    .panel.hap1 { background: var(--panel-hap1); }
    .panel.hap1 .panel-header { background: rgba(27,58,43,0.8); }
    .panel.hap2 { background: var(--panel-hap2); }
    .panel.hap2 .panel-header { background: rgba(58,43,27,0.8); }

    /* ── IGV overrides ───────────────────────────────────────────────────── */
    .igv-container { background: transparent !important; }

    /* Hide IGV navigation chrome on hap panels (they are synced via ref) */
    .panel.hap1 .igv-navbar,
    .panel.hap2 .igv-navbar { display: none !important; }

    /* ── Loading overlay ─────────────────────────────────────────────────── */
    .loading {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.7);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        font-size: 18px;
    }
    .loading.hidden { display: none; }

    /* ── Status bar ──────────────────────────────────────────────────────── */
    .status-bar {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: var(--surface);
        border-top: 1px solid var(--border);
        padding: 2px 12px;
        font-size: 11px;
        color: var(--text-muted);
        z-index: 100;
    }
</style>
</head>
<body>

<!-- Header bar -->
<div class="header">
    <h1>🧬 Long Read Viz</h1>

    <label>Sample:</label>
    <select id="sampleSelect"><option value="">Loading...</option></select>

    <label>Region:</label>
    <div class="nav-group">
        <button id="prevRegion" title="Previous region (←)">◀</button>
        <select id="regionSelect"><option value="">No regions</option></select>
        <button id="nextRegion" title="Next region (→)">▶</button>
        <span class="region-counter" id="regionCounter">0/0</span>
    </div>

    <div class="spacer"></div>

    <label class="sync-toggle">
        <input type="checkbox" id="syncToggle" checked>
        Sync panels
    </label>

    <div class="toolbar-group">
        <button id="toggleDisplayMode" class="toolbar-btn" title="Toggle read display density">
            <span class="btn-icon">☰</span> Squished
        </button>
        <button id="toggleSmallIndels" class="toolbar-btn active" title="Hide spurious small indels (long-read mode)">
            <span class="btn-icon">🧹</span> Hide indels
        </button>
    </div>
</div>

<!-- Panels -->
<div class="panels">
    <div class="panel ref">
        <div class="panel-header">
            <span>Reference</span>
            <span class="locus" id="refLocus"></span>
        </div>
        <div class="panel-body"><div id="igv-ref"></div></div>
    </div>
    <div class="panel hap1">
        <div class="panel-header">
            <span>Haplotype 1</span>
            <span class="locus" id="hap1Locus"></span>
        </div>
        <div class="panel-body"><div id="igv-hap1"></div></div>
    </div>
    <div class="panel hap2">
        <div class="panel-header">
            <span>Haplotype 2</span>
            <span class="locus" id="hap2Locus"></span>
        </div>
        <div class="panel-body"><div id="igv-hap2"></div></div>
    </div>
</div>

<div class="loading" id="loadingOverlay">Loading sample data...</div>
<div class="status-bar" id="statusBar">Ready</div>

<script>
(function() {
    "use strict";

    // ── State ───────────────────────────────────────────────────────────────
    let refBrowser = null;
    let hap1Browser = null;
    let hap2Browser = null;
    let currentSample = null;
    let regions = [];
    let currentRegionIdx = -1;
    let syncEnabled = true;
    let translating = false;
    let displaySquished = true;          // default: squished (compact)
    let hideSmallIndels = true;          // default: hide spurious indels (long-read mode)
    let opGeneration = 0;               // increments on sample/region change to invalidate stale ops
    const REGION_BUFFER_MULTIPLIER = 5;  // zoom out to region ± N× region-size

    // ── DOM refs ────────────────────────────────────────────────────────────
    const sampleSelect = document.getElementById("sampleSelect");
    const regionSelect = document.getElementById("regionSelect");
    const prevBtn = document.getElementById("prevRegion");
    const nextBtn = document.getElementById("nextRegion");
    const regionCounter = document.getElementById("regionCounter");
    const syncToggle = document.getElementById("syncToggle");
    const loadingOverlay = document.getElementById("loadingOverlay");
    const statusBar = document.getElementById("statusBar");
    const toggleDisplayModeBtn = document.getElementById("toggleDisplayMode");
    const toggleSmallIndelsBtn = document.getElementById("toggleSmallIndels");

    // ── Helpers ─────────────────────────────────────────────────────────────
    function setStatus(msg) { statusBar.textContent = msg; }
    function showLoading(show) {
        loadingOverlay.classList.toggle("hidden", !show);
    }

    async function fetchJSON(url) {
        const resp = await fetch(url);
        return resp.json();
    }

    // ── Initialization ──────────────────────────────────────────────────────
    async function init() {
        const samples = await fetchJSON("/api/samples");
        sampleSelect.innerHTML = "";
        for (const s of samples) {
            const opt = document.createElement("option");
            opt.value = s.sample_id;
            opt.textContent = s.sample_id;
            sampleSelect.appendChild(opt);
        }
        if (samples.length > 0) {
            await loadSample(samples[0].sample_id);
        }
        showLoading(false);
    }

    // ── Sample loading ──────────────────────────────────────────────────────
    function cancelPendingOps() {
        opGeneration++;
        translating = false;
        if (activeTranslateCtrl) {
            activeTranslateCtrl.abort();
            activeTranslateCtrl = null;
        }
        if (translateTimeout) {
            clearTimeout(translateTimeout);
            translateTimeout = null;
        }
    }

    async function loadSample(sampleId) {
        cancelPendingOps();
        showLoading(true);
        setStatus(`Loading sample ${sampleId}...`);
        console.log(`[LRV] Loading sample: ${sampleId}`);

        // Destroy existing browsers
        await destroyBrowsers();

        const config = await fetchJSON(`/api/sample/${sampleId}`);
        if (config.error) {
            setStatus(`Error: ${config.error}`);
            showLoading(false);
            return;
        }
        currentSample = config;
        console.log("[LRV] Sample config:", JSON.stringify({
            cram_ref: config.cram_ref || "(not set)",
            reads_cram: config.tracks.reads_cram || null,
            reads_to_hap1_cram: config.tracks.reads_to_hap1_cram || null,
            reads_to_hap2_cram: config.tracks.reads_to_hap2_cram || null,
        }));

        // Load regions
        regions = await fetchJSON(`/api/regions/${sampleId}`);
        populateRegions();

        // Create browsers
        try {
            await createBrowsers(config);
        } catch (err) {
            console.error("[LRV] Error creating browsers:", err);
            setStatus(`Error creating browsers: ${err.message}`);
            showLoading(false);
            return;
        }

        currentRegionIdx = -1;
        if (regions.length > 0) {
            navigateToRegion(0);
        }

        setStatus(`Loaded ${sampleId} — ${regions.length} region(s)`);
        showLoading(false);
    }

    async function destroyBrowsers() {
        for (const b of [refBrowser, hap1Browser, hap2Browser]) {
            if (b) {
                try { b.removeAllEventHandlers(); } catch(e) {}
                try { igv.removeBrowser(b); } catch(e) {}
            }
        }
        refBrowser = hap1Browser = hap2Browser = null;
        document.getElementById("igv-ref").innerHTML = "";
        document.getElementById("igv-hap1").innerHTML = "";
        document.getElementById("igv-hap2").innerHTML = "";
    }

    async function createBrowsers(config) {
        const baseUrl = window.location.origin;
        const readDisplayMode = displaySquished ? "SQUISHED" : "EXPANDED";

        // Resolve the CRAM decoding reference.  When the server provides
        // an explicit cram_ref, every CRAM track uses that FASTA for
        // decoding.  Otherwise we leave sequenceURL unset so igv.js falls
        // back to the browser-panel genome reference (which already carries
        // the .fai *and* .gzi indices).  Setting a redundant sequenceURL
        // creates a second IndexedFasta reader that may miss the .gzi
        // compressed index and attempt to download the entire bgzipped
        // reference into memory — the most likely cause of tab crashes.
        const cramRefUrl = config.cram_ref ? (baseUrl + config.cram_ref) : null;
        const cramRefIdxUrl = cramRefUrl ? (cramRefUrl + ".fai") : null;
        if (cramRefUrl) {
            console.log("[LRV] Using explicit cram_ref for CRAM decoding:", cramRefUrl);
        }

        // Helper: build an alignment track for reads (BAM or CRAM)
        function makeReadTrack(name, bamUrl, cramUrl, opts) {
            // If bamUrl actually points to a CRAM file, treat it as CRAM
            if (bamUrl && bamUrl.endsWith('.cram')) {
                cramUrl = cramUrl || bamUrl;
                bamUrl = null;
            }
            const isCram = !bamUrl && cramUrl;
            const url = isCram ? cramUrl : bamUrl;
            if (!url) return null;

            const track = {
                name: name,
                type: "alignment",
                format: isCram ? "cram" : "bam",
                url: baseUrl + url,
                indexURL: baseUrl + url + (isCram ? ".crai" : ".bai"),
                height: 120,
                displayMode: readDisplayMode,
                showSoftClips: false,
                hideSmallIndels: hideSmallIndels,
                smallIndelThreshold: 3,
                colorBy: "strand",
                visibilityWindow: 30000,
                ...opts,
            };
            // CRAM files require a reference FASTA for decoding.
            // When an explicit cram_ref is configured, use it.
            // Otherwise, let igv.js use the panel's genome reference
            // which already has proper .fai and .gzi indices loaded.
            if (isCram) {
                if (cramRefUrl) {
                    track.sequenceURL = cramRefUrl;
                    track.sequenceIndexURL = cramRefIdxUrl;
                    console.log(`[LRV] CRAM track "${name}": using explicit cram_ref`);
                } else {
                    console.log(`[LRV] CRAM track "${name}": using panel genome reference for decoding`);
                }
            }
            return track;
        }

        // Helper: build an alignment track for assembly cross-checks
        function makeAssemblyTrack(name, bamUrl, color) {
            if (!bamUrl) return null;
            return {
                name: name,
                type: "alignment",
                format: "bam",
                url: baseUrl + bamUrl,
                indexURL: baseUrl + bamUrl + ".bai",
                height: 60,
                color: color,
                displayMode: "SQUISHED",
                showSoftClips: false,
                hideSmallIndels: hideSmallIndels,
                smallIndelThreshold: 3,
                visibilityWindow: 1000000,
            };
        }

        // ── Reference panel ──────────────────────────────────────────────
        const refOpts = {
            showNavigation: true,
            showCenterGuide: true,
            loadDefaultGenomes: false,
            genomeList: null,
            reference: {
                fastaURL: baseUrl + config.reference.fastaURL,
                indexURL: baseUrl + config.reference.fastaURL + ".fai",
                compressedIndexURL: baseUrl + config.reference.fastaURL + ".gzi",
            },
            tracks: [],
        };

        // Reads → Ref (BAM or CRAM)
        const readsRefTrack = makeReadTrack(
            "Reads → Ref",
            config.tracks.reads_bam,
            config.tracks.reads_cram,
            {}
        );
        if (readsRefTrack) refOpts.tracks.push(readsRefTrack);

        // Hap1 → Ref
        const hap1RefTrack = makeAssemblyTrack("Hap1 → Ref", config.tracks.hap1_to_ref_bam, "#4CAF50");
        if (hap1RefTrack) refOpts.tracks.push(hap1RefTrack);

        // Hap2 → Ref
        const hap2RefTrack = makeAssemblyTrack("Hap2 → Ref", config.tracks.hap2_to_ref_bam, "#FF9800");
        if (hap2RefTrack) refOpts.tracks.push(hap2RefTrack);

        // ── Hap1 panel ───────────────────────────────────────────────────
        const hap1Opts = {
            showNavigation: false,
            showCenterGuide: true,
            loadDefaultGenomes: false,
            genomeList: null,
            reference: {
                fastaURL: baseUrl + config.hap1_assembly.fastaURL,
                indexURL: baseUrl + config.hap1_assembly.fastaURL + ".fai",
                compressedIndexURL: baseUrl + config.hap1_assembly.fastaURL + ".gzi",
            },
            tracks: [],
        };

        // Reads → Hap1 (BAM or CRAM)
        const readsHap1Track = makeReadTrack(
            "Reads → Hap1",
            config.tracks.reads_to_hap1_bam,
            config.tracks.reads_to_hap1_cram,
            {}
        );
        if (readsHap1Track) hap1Opts.tracks.push(readsHap1Track);

        // Ref → Hap1
        const refHap1Track = makeAssemblyTrack("Ref → Hap1", config.tracks.ref_to_hap1_bam, "#2196F3");
        if (refHap1Track) hap1Opts.tracks.push(refHap1Track);

        // ── Hap2 panel ───────────────────────────────────────────────────
        const hap2Opts = {
            showNavigation: false,
            showCenterGuide: true,
            loadDefaultGenomes: false,
            genomeList: null,
            reference: {
                fastaURL: baseUrl + config.hap2_assembly.fastaURL,
                indexURL: baseUrl + config.hap2_assembly.fastaURL + ".fai",
                compressedIndexURL: baseUrl + config.hap2_assembly.fastaURL + ".gzi",
            },
            tracks: [],
        };

        // Reads → Hap2 (BAM or CRAM)
        const readsHap2Track = makeReadTrack(
            "Reads → Hap2",
            config.tracks.reads_to_hap2_bam,
            config.tracks.reads_to_hap2_cram,
            {}
        );
        if (readsHap2Track) hap2Opts.tracks.push(readsHap2Track);

        // Ref → Hap2
        const refHap2Track = makeAssemblyTrack("Ref → Hap2", config.tracks.ref_to_hap2_bam, "#2196F3");
        if (refHap2Track) hap2Opts.tracks.push(refHap2Track);

        // Create all three browsers
        console.log("[LRV] Creating IGV browsers...");
        console.log("[LRV] Ref panel tracks:", refOpts.tracks.length,
                     refOpts.tracks.map(t => `${t.name}(${t.format})`));
        console.log("[LRV] Hap1 panel tracks:", hap1Opts.tracks.length,
                     hap1Opts.tracks.map(t => `${t.name}(${t.format})`));
        console.log("[LRV] Hap2 panel tracks:", hap2Opts.tracks.length,
                     hap2Opts.tracks.map(t => `${t.name}(${t.format})`));

        [refBrowser, hap1Browser, hap2Browser] = await Promise.all([
            igv.createBrowser(document.getElementById("igv-ref"), refOpts),
            igv.createBrowser(document.getElementById("igv-hap1"), hap1Opts),
            igv.createBrowser(document.getElementById("igv-hap2"), hap2Opts),
        ]);

        console.log("[LRV] All IGV browsers created successfully");

        // Attach coordination listener to reference panel
        refBrowser.on("locuschange", onRefLocusChange);
    }

    // ── Coordinate translation & panel sync ─────────────────────────────────
    let translateTimeout = null;
    let activeTranslateCtrl = null;   // AbortController for in-flight translate fetch

    function onRefLocusChange(referenceFrameList) {
        if (!syncEnabled || translating) return;

        // Update locus display
        const locus = formatLocus(referenceFrameList);
        document.getElementById("refLocus").textContent = locus;

        // Cancel any in-flight translate request and reset the debounce.
        // This is the primary guard against concurrent syncs: each pan event
        // aborts the previous network call before scheduling a new one.
        if (activeTranslateCtrl) {
            activeTranslateCtrl.abort();
            activeTranslateCtrl = null;
        }
        if (translateTimeout) clearTimeout(translateTimeout);
        translateTimeout = setTimeout(() => translateAndSync(referenceFrameList), 500);
    }

    async function translateAndSync(referenceFrameList) {
        if (!currentSample || !syncEnabled || translating) return;

        // Capture generation so we can detect stale results.
        const gen = opGeneration;

        // Abort any previous in-flight request (safety net for back-to-back calls).
        if (activeTranslateCtrl) activeTranslateCtrl.abort();
        activeTranslateCtrl = new AbortController();
        const thisCtrl = activeTranslateCtrl;
        const { signal } = thisCtrl;

        const frame = referenceFrameList[0];
        if (!frame) return;

        const chrom = frame.chr;
        const start = Math.round(frame.start);
        const end = Math.round(frame.end);

        try {
            const resp = await fetch(
                `/api/translate?sample=${currentSample.sample_id}` +
                `&chrom=${encodeURIComponent(chrom)}&start=${start}&end=${end}`,
                { signal }
            );
            if (signal.aborted || gen !== opGeneration) return;
            const result = await resp.json();
            if (signal.aborted || gen !== opGeneration) return;

            // Set the flag *before* driving the hap browsers so that any
            // locuschange fired by their search() calls is ignored.
            // NOTE: we intentionally do NOT set translating=true before the
            // fetch above, because onRefLocusChange needs translating=false
            // to abort this request and queue an updated position if the user
            // keeps panning during the network round-trip.
            translating = true;

            // Navigate hap1 panel
            if (result.hap1 && result.hap1.length > 0 && hap1Browser) {
                const r = result.hap1[0];
                const locus = `${r.chrom}:${r.start}-${r.end}`;
                await hap1Browser.search(locus);
                if (gen !== opGeneration) return;
                document.getElementById("hap1Locus").textContent = locus;
            }

            // Navigate hap2 panel
            if (result.hap2 && result.hap2.length > 0 && hap2Browser) {
                const r = result.hap2[0];
                const locus = `${r.chrom}:${r.start}-${r.end}`;
                await hap2Browser.search(locus);
                if (gen !== opGeneration) return;
                document.getElementById("hap2Locus").textContent = locus;
            }

            translating = false;
        } catch (err) {
            translating = false;
            if (err.name !== "AbortError") {
                console.warn("Translation error:", err);
            }
        } finally {
            // Only clear activeTranslateCtrl if this call is still the active
            // one; a newer call may have already replaced it.
            if (activeTranslateCtrl === thisCtrl) {
                activeTranslateCtrl = null;
            }
        }
    }

    function formatLocus(frames) {
        if (!frames || frames.length === 0) return "";
        const f = frames[0];
        return `${f.chr}:${Math.round(f.start).toLocaleString()}-${Math.round(f.end).toLocaleString()}`;
    }

    // ── Region navigation ───────────────────────────────────────────────────
    function populateRegions() {
        regionSelect.innerHTML = "";
        if (regions.length === 0) {
            const opt = document.createElement("option");
            opt.value = "";
            opt.textContent = "No regions loaded";
            regionSelect.appendChild(opt);
            regionCounter.textContent = "0/0";
            return;
        }
        regions.forEach((r, i) => {
            const opt = document.createElement("option");
            opt.value = i;
            opt.textContent = r.label;
            regionSelect.appendChild(opt);
        });
        regionCounter.textContent = `0/${regions.length}`;
    }

    async function navigateToRegion(idx) {
        if (idx < 0 || idx >= regions.length) return;
        cancelPendingOps();
        currentRegionIdx = idx;
        regionSelect.value = idx;
        regionCounter.textContent = `${idx + 1}/${regions.length}`;

        const region = regions[idx];
        setStatus(`Navigating to ${region.label}`);

        const gen = opGeneration;
        translating = true;
        try {
            // Navigate reference panel to the region with 5x buffer on each side.
            // Parse the region coordinates, from the explicit ref_region or chrom:start-end.
            let refChrom, refStart, refEnd;
            if (region.ref_region) {
                const m = region.ref_region.match(/^(.+):(\d+)-(\d+)$/);
                if (m) {
                    refChrom = m[1];
                    refStart = parseInt(m[2], 10);
                    refEnd = parseInt(m[3], 10);
                }
            }
            if (!refChrom) {
                refChrom = region.chrom;
                refStart = parseInt(region.start, 10);
                refEnd = parseInt(region.end, 10);
            }
            const regionSize = refEnd - refStart;
            const buffer = regionSize * REGION_BUFFER_MULTIPLIER;
            const bufferedStart = Math.max(0, refStart - buffer);
            const bufferedEnd = refEnd + buffer;
            const refLocus = `${refChrom}:${bufferedStart}-${bufferedEnd}`;
            if (refBrowser) {
                await refBrowser.search(refLocus);
                if (gen !== opGeneration) return;
                document.getElementById("refLocus").textContent = refLocus;
            }

            // Navigate assembly panels using pre-computed regions if available
            const hasHap1 = region.hap1_regions && region.hap1_regions.length > 0;
            const hasHap2 = region.hap2_regions && region.hap2_regions.length > 0;

            if (hasHap1 && hap1Browser) {
                const h1 = region.hap1_regions[0];
                await hap1Browser.search(h1);
                if (gen !== opGeneration) return;
                document.getElementById("hap1Locus").textContent = h1;
            }
            if (hasHap2 && hap2Browser) {
                const h2 = region.hap2_regions[0];
                await hap2Browser.search(h2);
                if (gen !== opGeneration) return;
                document.getElementById("hap2Locus").textContent = h2;
            }

            // If either haplotype lacks pre-computed regions, use dynamic translation
            if ((!hasHap1 || !hasHap2) && currentSample && syncEnabled) {
                try {
                    const result = await fetchJSON(
                        `/api/translate?sample=${currentSample.sample_id}` +
                        `&chrom=${encodeURIComponent(region.chrom)}` +
                        `&start=${region.start}&end=${region.end}`
                    );
                    if (gen !== opGeneration) return;
                    if (!hasHap1 && result.hap1 && result.hap1.length > 0 && hap1Browser) {
                        const r = result.hap1[0];
                        const locus = `${r.chrom}:${r.start}-${r.end}`;
                        await hap1Browser.search(locus);
                        if (gen !== opGeneration) return;
                        document.getElementById("hap1Locus").textContent = locus;
                    }
                    if (!hasHap2 && result.hap2 && result.hap2.length > 0 && hap2Browser) {
                        const r = result.hap2[0];
                        const locus = `${r.chrom}:${r.start}-${r.end}`;
                        await hap2Browser.search(locus);
                        if (gen !== opGeneration) return;
                        document.getElementById("hap2Locus").textContent = locus;
                    }
                } catch (err) {
                    console.warn("Region translation error:", err);
                }
            }
        } finally {
            translating = false;
        }
    }

    // ── Event listeners ─────────────────────────────────────────────────────
    sampleSelect.addEventListener("change", () => loadSample(sampleSelect.value));

    regionSelect.addEventListener("change", () => {
        const idx = parseInt(regionSelect.value, 10);
        if (!isNaN(idx)) navigateToRegion(idx);
    });

    prevBtn.addEventListener("click", () => {
        if (currentRegionIdx > 0) navigateToRegion(currentRegionIdx - 1);
    });

    nextBtn.addEventListener("click", () => {
        if (currentRegionIdx < regions.length - 1) navigateToRegion(currentRegionIdx + 1);
    });

    syncToggle.addEventListener("change", () => {
        syncEnabled = syncToggle.checked;
    });

    // ── Display mode toggle ─────────────────────────────────────────────────
    function updateAllTrackDisplayModes() {
        const mode = displaySquished ? "SQUISHED" : "EXPANDED";
        for (const browser of [refBrowser, hap1Browser, hap2Browser]) {
            if (!browser) continue;
            for (const track of browser.trackViews) {
                if (track.track && track.track.type === "alignment") {
                    track.track.displayMode = mode;
                }
            }
            browser.updateViews();
        }
    }

    function updateAllTrackIndelDisplay() {
        for (const browser of [refBrowser, hap1Browser, hap2Browser]) {
            if (!browser) continue;
            for (const track of browser.trackViews) {
                if (track.track && track.track.type === "alignment") {
                    track.track.hideSmallIndels = hideSmallIndels;
                    track.track.smallIndelThreshold = 3;
                }
            }
            browser.updateViews();
        }
    }

    toggleDisplayModeBtn.addEventListener("click", () => {
        displaySquished = !displaySquished;
        toggleDisplayModeBtn.innerHTML = displaySquished
            ? '<span class="btn-icon">☰</span> Squished'
            : '<span class="btn-icon">≡</span> Expanded';
        toggleDisplayModeBtn.classList.toggle("active", !displaySquished);
        updateAllTrackDisplayModes();
    });

    toggleSmallIndelsBtn.addEventListener("click", () => {
        hideSmallIndels = !hideSmallIndels;
        toggleSmallIndelsBtn.classList.toggle("active", hideSmallIndels);
        toggleSmallIndelsBtn.innerHTML = hideSmallIndels
            ? '<span class="btn-icon">🧹</span> Hide indels'
            : '<span class="btn-icon">🔍</span> Show indels';
        updateAllTrackIndelDisplay();
    });

    // Keyboard shortcuts
    document.addEventListener("keydown", (e) => {
        if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
        if (e.key === "ArrowLeft" || e.key === "[") {
            e.preventDefault();
            prevBtn.click();
        } else if (e.key === "ArrowRight" || e.key === "]") {
            e.preventDefault();
            nextBtn.click();
        }
    });

    // ── Start ───────────────────────────────────────────────────────────────
    init().catch(err => {
        setStatus("Error: " + err.message);
        showLoading(false);
        console.error(err);
    });
})();
</script>
</body>
</html>
