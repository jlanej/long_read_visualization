<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Long Read Visualization — Multi-Panel IGV.js</title>
<script src="/static/igv.min.js"></script>
<style>
    :root {
        --bg: #f5f5f5;
        --surface: #ffffff;
        --surface2: #f0f0f0;
        --accent: #374151;
        --accent-active: #111827;
        --text: #1f2937;
        --text-muted: #6b7280;
        --border: #d1d5db;
        --border-light: #e5e7eb;
        --panel-bg: #ffffff;
        --ref-panel-flex: 1.3;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
    }

    /* ── Header bar ──────────────────────────────────────────────────────── */
    .header {
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        padding: 6px 16px;
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
    }
    .header h1 {
        font-size: 15px;
        font-weight: 600;
        white-space: nowrap;
        color: var(--text);
    }
    .header label {
        font-size: 12px;
        color: var(--text-muted);
        font-weight: 500;
    }
    .header select, .header input, .header button {
        font-size: 12px;
        padding: 4px 8px;
        border-radius: 4px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
    }
    .header select {
        min-width: 160px;
        max-width: 400px;
        background: var(--surface);
    }
    .header button {
        cursor: pointer;
        background: var(--surface2);
        border-color: var(--border);
        font-weight: 500;
        color: var(--text);
    }
    .header button:hover {
        background: var(--border-light);
        border-color: var(--text-muted);
    }
    .header button:disabled { opacity: 0.4; cursor: default; }

    .spacer { flex: 1; }

    .nav-group {
        display: flex;
        align-items: center;
        gap: 4px;
    }
    .region-counter {
        font-size: 11px;
        color: var(--text-muted);
        min-width: 48px;
        text-align: center;
    }

    .sync-toggle {
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: 12px;
        cursor: pointer;
        color: var(--text-muted);
    }
    .sync-toggle input[type="checkbox"] {
        accent-color: var(--accent);
    }

    /* ── Toolbar buttons ────────────────────────────────────────────────── */
    .toolbar-group {
        display: flex;
        align-items: center;
        gap: 4px;
        margin-left: 4px;
    }
    .toolbar-btn {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        font-size: 11px;
        padding: 3px 8px;
        border-radius: 4px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text-muted);
        cursor: pointer;
        transition: background 0.15s, color 0.15s, border-color 0.15s;
        white-space: nowrap;
    }
    .toolbar-btn:hover {
        background: var(--surface2);
        color: var(--text);
    }
    .toolbar-btn.active {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
    }
    .btn-icon { font-size: 12px; }

    /* ── Panel layout ────────────────────────────────────────────────────── */
    .panels {
        display: flex;
        flex-direction: column;
        gap: 0;
        padding: 0;
        height: calc(100vh - 44px);
        overflow: hidden;
        background: var(--bg);
    }
    .panel {
        flex: 0 0 auto;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        min-height: 0;
        background: var(--panel-bg);
    }
    .panel.ref { border-top: 0; }
    .panel-header {
        padding: 2px 10px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        color: var(--text-muted);
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: var(--surface2);
        border-bottom: 1px solid var(--border-light);
    }
    .panel-header .locus {
        font-size: 11px;
        font-weight: 400;
        color: var(--text-muted);
        font-family: monospace;
        text-transform: none;
        letter-spacing: normal;
    }
    .panel-body {
        flex: 1;
        position: relative;
        min-height: 0;
        overflow: auto;
    }
    .panel-body > div {
        height: 100%;
    }
    .splitter {
        height: 6px;
        flex: 0 0 6px;
        cursor: row-resize;
        position: relative;
        background: var(--bg);
        border-top: 1px solid var(--border-light);
        border-bottom: 1px solid var(--border-light);
    }
    .splitter:hover,
    .splitter.active {
        background: var(--border);
    }

    /* ── IGV overrides ───────────────────────────────────────────────────── */
    /* Let IGV.js use its native white background */
    .igv-container {
        border: none !important;
        background: var(--panel-bg) !important;
    }
    /* Tame the IGV navbar to match the light theme */
    .igv-navbar {
        background: var(--surface) !important;
        border-bottom: 1px solid var(--border-light) !important;
    }
    /* Track labels: keep readable against the white IGV canvas */
    .igv-track-label {
        background: rgba(255,255,255,0.85) !important;
        color: var(--accent) !important;
        border: 1px solid var(--border) !important;
        font-size: 11px !important;
        text-shadow: none !important;
    }

    /* Hide IGV navigation chrome on hap panels (they are synced via ref) */
    .panel.hap1 .igv-navbar,
    .panel.hap2 .igv-navbar { display: none !important; }

    /* ── Read Comparison modal ──────────────────────────────────────────── */
    .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.35);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10000;
    }
    .modal-backdrop.hidden { display: none; }
    .modal-box {
        background: var(--surface);
        border-radius: 8px;
        box-shadow: 0 8px 32px rgba(0,0,0,0.18);
        padding: 24px;
        min-width: 420px;
        max-width: 640px;
        max-height: 80vh;
        overflow-y: auto;
    }
    .modal-box h2 {
        font-size: 16px;
        font-weight: 600;
        margin-bottom: 12px;
        color: var(--text);
    }
    .modal-box .close-btn {
        float: right;
        background: none;
        border: none;
        font-size: 20px;
        cursor: pointer;
        color: var(--text-muted);
        padding: 0 4px;
        line-height: 1;
    }
    .modal-box .close-btn:hover { color: var(--text); }
    .modal-box table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
        margin-top: 8px;
    }
    .modal-box th, .modal-box td {
        text-align: left;
        padding: 6px 10px;
        border-bottom: 1px solid var(--border-light);
    }
    .modal-box th {
        font-weight: 600;
        color: var(--text-muted);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }
    .modal-box td.count { text-align: right; font-variant-numeric: tabular-nums; }
    .modal-box .section-label {
        font-weight: 600;
        font-size: 12px;
        color: var(--accent);
        padding-top: 10px;
    }
    .modal-box .read-list {
        max-height: 120px;
        overflow-y: auto;
        font-family: monospace;
        font-size: 11px;
        background: var(--bg);
        border: 1px solid var(--border-light);
        border-radius: 4px;
        padding: 6px 8px;
        margin-top: 4px;
        white-space: pre-wrap;
        word-break: break-all;
    }
    .modal-box details { margin-top: 6px; }
    .modal-box summary {
        cursor: pointer;
        font-size: 12px;
        color: var(--accent);
    }
    .modal-box summary:hover { text-decoration: underline; }
    .modal-box .note {
        font-size: 11px;
        color: var(--text-muted);
        margin-top: 12px;
        line-height: 1.4;
    }

    /* ── Dot Plot modal ────────────────────────────────────────────────── */
    .dotplot-modal .modal-box {
        min-width: 320px;
        max-width: 95vw;
        width: 1100px;
        max-height: 92vh;
    }
    .dotplot-controls {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 14px;
        flex-wrap: wrap;
    }
    .dotplot-controls label {
        font-size: 12px;
        color: var(--text-muted);
        font-weight: 500;
    }
    .dotplot-controls input[type="number"] {
        width: 64px;
        font-size: 12px;
        padding: 3px 6px;
        border-radius: 4px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
    }
    .dotplot-controls button {
        font-size: 11px;
        padding: 4px 12px;
        border-radius: 4px;
        border: 1px solid var(--border);
        background: var(--accent);
        color: #fff;
        cursor: pointer;
        font-weight: 500;
    }
    .dotplot-controls button:hover {
        background: var(--accent-active);
    }
    .dotplot-grid {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 12px;
    }
    @media (max-width: 900px) {
        .dotplot-grid { grid-template-columns: 1fr; }
    }
    .dotplot-cell {
        background: var(--surface);
        border: 1px solid var(--border-light);
        border-radius: 6px;
        padding: 8px;
        text-align: center;
    }
    .dotplot-cell h3 {
        font-size: 12px;
        font-weight: 600;
        color: var(--text);
        margin-bottom: 6px;
    }
    .dotplot-cell canvas {
        display: block;
        margin: 0 auto;
        border: 1px solid var(--border-light);
        border-radius: 2px;
        background: #fff;
        max-width: 100%;
        height: auto;
    }
    .dotplot-cell .dotplot-info {
        font-size: 10px;
        color: var(--text-muted);
        margin-top: 4px;
    }
    .dotplot-legend {
        display: flex;
        justify-content: center;
        gap: 16px;
        margin-top: 10px;
        font-size: 11px;
        color: var(--text-muted);
    }
    .dotplot-legend-item {
        display: flex;
        align-items: center;
        gap: 4px;
    }
    .dotplot-legend-swatch {
        width: 12px;
        height: 12px;
        border-radius: 2px;
        border: 1px solid var(--border);
    }
    .dotplot-citation {
        font-size: 10px;
        color: var(--text-muted);
        margin-top: 10px;
        text-align: center;
        line-height: 1.4;
    }
    .dotplot-citation a {
        color: var(--accent);
        text-decoration: none;
    }
    .dotplot-citation a:hover { text-decoration: underline; }

    /* ── Loading overlay ─────────────────────────────────────────────────── */
    .loading {
        position: fixed;
        inset: 0;
        background: rgba(255,255,255,0.85);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        font-size: 16px;
        color: var(--text);
    }
    .loading.hidden { display: none; }

    /* ── Status bar ──────────────────────────────────────────────────────── */
    .status-bar {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: var(--surface);
        border-top: 1px solid var(--border-light);
        padding: 2px 12px;
        font-size: 11px;
        color: var(--text-muted);
        z-index: 100;
    }
</style>
</head>
<body>

<!-- Header bar -->
<div class="header">
    <h1>🧬 Long Read Viz</h1>

    <label>Sample:</label>
    <select id="sampleSelect"><option value="">Loading...</option></select>

    <label>Region:</label>
    <div class="nav-group">
        <button id="prevRegion" title="Previous region (←)">◀</button>
        <select id="regionSelect"><option value="">No regions</option></select>
        <button id="nextRegion" title="Next region (→)">▶</button>
        <span class="region-counter" id="regionCounter">0/0</span>
    </div>

    <div class="spacer"></div>

    <label class="sync-toggle">
        <input type="checkbox" id="syncToggle" checked>
        Sync panels
    </label>

    <div class="toolbar-group">
        <button id="toggleDisplayMode" class="toolbar-btn" title="Toggle read display density">
            <span class="btn-icon">☰</span> Squished
        </button>
        <button id="toggleSmallIndels" class="toolbar-btn active" title="Hide spurious small indels (long-read mode)">
            <span class="btn-icon">🧹</span> Hide indels
        </button>
        <button id="compareReads" class="toolbar-btn" title="Compare read IDs across all three panels">
            <span class="btn-icon">📊</span> Compare Reads
        </button>
        <button id="dotPlotBtn" class="toolbar-btn" title="Generate k-mer dot plots comparing sequences across panels">
            <span class="btn-icon">🔵</span> Dot Plots
        </button>
    </div>
</div>

<!-- Panels -->
<div class="panels">
    <div class="panel ref">
        <div class="panel-header">
            <span>Reference</span>
            <span class="locus" id="refLocus"></span>
        </div>
        <div class="panel-body"><div id="igv-ref"></div></div>
    </div>
    <div class="splitter" id="splitter-ref-hap1" aria-label="Resize Reference and Haplotype 1 panels"></div>
    <div class="panel hap1">
        <div class="panel-header">
            <span>Haplotype 1</span>
            <span class="locus" id="hap1Locus"></span>
        </div>
        <div class="panel-body"><div id="igv-hap1"></div></div>
    </div>
    <div class="splitter" id="splitter-hap1-hap2" aria-label="Resize Haplotype 1 and Haplotype 2 panels"></div>
    <div class="panel hap2">
        <div class="panel-header">
            <span>Haplotype 2</span>
            <span class="locus" id="hap2Locus"></span>
        </div>
        <div class="panel-body"><div id="igv-hap2"></div></div>
    </div>
</div>

<!-- Read Comparison modal -->
<div class="modal-backdrop hidden" id="readCompareModal">
    <div class="modal-box">
        <button class="close-btn" id="readCompareClose" title="Close">&times;</button>
        <h2>📊 Read ID Comparison</h2>
        <div id="readCompareBody">Analyzing...</div>
    </div>
</div>

<!-- Dot Plot modal -->
<div class="modal-backdrop hidden dotplot-modal" id="dotPlotModal">
    <div class="modal-box">
        <button class="close-btn" id="dotPlotClose" title="Close">&times;</button>
        <h2>🔵 K-mer Dot Plots</h2>
        <div class="dotplot-controls">
            <label>K-mer size:</label>
            <input type="number" id="dotPlotK" value="31" min="1" max="101" step="2">
            <button id="dotPlotRun">Generate</button>
            <span id="dotPlotStatus" style="font-size:11px;color:var(--text-muted)"></span>
        </div>
        <div id="dotPlotBody">
            <p style="font-size:12px;color:var(--text-muted)">
                Click <strong>Generate</strong> to compute dot plots for the
                currently visible regions in all three panels.
            </p>
        </div>
    </div>
</div>

<div class="loading" id="loadingOverlay">Loading sample data...</div>
<div class="status-bar" id="statusBar">Ready</div>

<script>
(function() {
    "use strict";

    // ── State ───────────────────────────────────────────────────────────────
    let refBrowser = null;
    let hap1Browser = null;
    let hap2Browser = null;
    let currentSample = null;
    let regions = [];
    let currentRegionIdx = -1;
    let syncEnabled = true;
    let translating = false;
    let displaySquished = true;          // default: squished (compact)
    let hideSmallIndels = true;          // default: hide spurious indels (long-read mode)
    let opGeneration = 0;               // increments on sample/region change to invalidate stale ops
    const REGION_BUFFER_MULTIPLIER = 5;   // buffer = 5 × SV event size on each side (~4.2 kb for an 834 bp SV)
    const MIN_REGION_BUFFER = 1000;       // minimum buffer so tiny regions still show context
    const SPLITTER_HEIGHT = 6;
    const MIN_PANEL_HEIGHT = 120;
    const MIN_TOTAL_PANEL_HEIGHT = 300;
    const REF_PANEL_HEIGHT_RATIO = 0.44;  // keeps reference panel slightly larger by default
    // No MAX_REGION_BUFFER — buffer is fully dynamic, proportional to the SV event size.

    // ── DOM refs ────────────────────────────────────────────────────────────
    const sampleSelect = document.getElementById("sampleSelect");
    const regionSelect = document.getElementById("regionSelect");
    const prevBtn = document.getElementById("prevRegion");
    const nextBtn = document.getElementById("nextRegion");
    const regionCounter = document.getElementById("regionCounter");
    const syncToggle = document.getElementById("syncToggle");
    const loadingOverlay = document.getElementById("loadingOverlay");
    const statusBar = document.getElementById("statusBar");
    const toggleDisplayModeBtn = document.getElementById("toggleDisplayMode");
    const toggleSmallIndelsBtn = document.getElementById("toggleSmallIndels");
    const compareReadsBtn = document.getElementById("compareReads");
    const readCompareModal = document.getElementById("readCompareModal");
    const readCompareClose = document.getElementById("readCompareClose");
    const readCompareBody = document.getElementById("readCompareBody");
    const panelsContainer = document.querySelector(".panels");
    const refPanel = document.querySelector(".panel.ref");
    const hap1Panel = document.querySelector(".panel.hap1");
    const hap2Panel = document.querySelector(".panel.hap2");
    const splitterRefHap1 = document.getElementById("splitter-ref-hap1");
    const splitterHap1Hap2 = document.getElementById("splitter-hap1-hap2");
    const dotPlotBtn = document.getElementById("dotPlotBtn");
    const dotPlotModal = document.getElementById("dotPlotModal");
    const dotPlotClose = document.getElementById("dotPlotClose");
    const dotPlotBody = document.getElementById("dotPlotBody");
    const dotPlotKInput = document.getElementById("dotPlotK");
    const dotPlotRunBtn = document.getElementById("dotPlotRun");
    const dotPlotStatus = document.getElementById("dotPlotStatus");

    // ── Helpers ─────────────────────────────────────────────────────────────
    function setStatus(msg) { statusBar.textContent = msg; }
    function showLoading(show) {
        loadingOverlay.classList.toggle("hidden", !show);
    }

    function parseLocusSpan(locus) {
        if (!locus) return null;
        // Match the final ":start-end" suffix so contig names containing ':'
        // (toy/reference subregion names) are handled correctly.
        const m = locus.match(/^(.+):(\d+)-(\d+)$/);
        if (!m) return null;
        const start = parseInt(m[2], 10);
        const end = parseInt(m[3], 10);
        return computeInclusiveSpan(start, end);
    }

    function computeInclusiveSpan(start, end) {
        if (!Number.isFinite(start) || !Number.isFinite(end) || end < start) return null;
        return end - start + 1;
    }

    async function fetchJSON(url) {
        const resp = await fetch(url);
        return resp.json();
    }

    function setInitialPanelHeights() {
        if (!panelsContainer || !refPanel || !hap1Panel || !hap2Panel) return;
        const splitterHeight = ((splitterRefHap1?.offsetHeight || 0) +
            (splitterHap1Hap2?.offsetHeight || 0)) || (2 * SPLITTER_HEIGHT);
        const available = Math.max(
            MIN_TOTAL_PANEL_HEIGHT,
            panelsContainer.clientHeight - splitterHeight
        );
        const refHeight = Math.round(available * REF_PANEL_HEIGHT_RATIO);
        const hapHeight = Math.round((available - refHeight) / 2);
        refPanel.style.height = `${refHeight}px`;
        hap1Panel.style.height = `${hapHeight}px`;
        hap2Panel.style.height = `${available - refHeight - hapHeight}px`;
    }

    function setupPanelResizer(splitter, upperPanel, lowerPanel) {
        if (!splitter || !upperPanel || !lowerPanel) return;
        let startY = 0;
        let upperStart = 0;
        let lowerStart = 0;

        const onMove = (e) => {
            const delta = e.clientY - startY;
            let newUpper = upperStart + delta;
            let newLower = lowerStart - delta;
            if (newUpper < MIN_PANEL_HEIGHT) {
                newLower -= (MIN_PANEL_HEIGHT - newUpper);
                newUpper = MIN_PANEL_HEIGHT;
            }
            if (newLower < MIN_PANEL_HEIGHT) {
                newUpper -= (MIN_PANEL_HEIGHT - newLower);
                newLower = MIN_PANEL_HEIGHT;
            }
            upperPanel.style.height = `${Math.max(MIN_PANEL_HEIGHT, Math.round(newUpper))}px`;
            lowerPanel.style.height = `${Math.max(MIN_PANEL_HEIGHT, Math.round(newLower))}px`;
        };

        const onUp = () => {
            splitter.classList.remove("active");
            document.removeEventListener("pointermove", onMove);
            document.removeEventListener("pointerup", onUp);
        };

        splitter.addEventListener("pointerdown", (e) => {
            e.preventDefault();
            startY = e.clientY;
            upperStart = upperPanel.getBoundingClientRect().height;
            lowerStart = lowerPanel.getBoundingClientRect().height;
            splitter.classList.add("active");
            document.addEventListener("pointermove", onMove);
            document.addEventListener("pointerup", onUp);
        });
    }

    // ── Initialization ──────────────────────────────────────────────────────
    async function init() {
        const samples = await fetchJSON("/api/samples");
        sampleSelect.innerHTML = "";
        for (const s of samples) {
            const opt = document.createElement("option");
            opt.value = s.sample_id;
            opt.textContent = s.sample_id;
            sampleSelect.appendChild(opt);
        }
        if (samples.length > 0) {
            await loadSample(samples[0].sample_id);
        }
        showLoading(false);
    }

    // ── Sample loading ──────────────────────────────────────────────────────
    function cancelPendingOps() {
        opGeneration++;
        translating = false;
        if (activeTranslateCtrl) {
            activeTranslateCtrl.abort();
            activeTranslateCtrl = null;
        }
        if (translateTimeout) {
            clearTimeout(translateTimeout);
            translateTimeout = null;
        }
    }

    async function loadSample(sampleId) {
        cancelPendingOps();
        showLoading(true);
        setStatus(`Loading sample ${sampleId}...`);
        console.log(`[LRV] Loading sample: ${sampleId}`);

        // Destroy existing browsers
        await destroyBrowsers();

        const config = await fetchJSON(`/api/sample/${sampleId}`);
        if (config.error) {
            setStatus(`Error: ${config.error}`);
            showLoading(false);
            return;
        }
        currentSample = config;
        console.log("[LRV] Sample config:", JSON.stringify({
            cram_ref: config.cram_ref || "(not set)",
            reads_cram: config.tracks.reads_cram || null,
            reads_to_hap1_cram: config.tracks.reads_to_hap1_cram || null,
            reads_to_hap2_cram: config.tracks.reads_to_hap2_cram || null,
        }));

        // Load regions
        regions = await fetchJSON(`/api/regions/${sampleId}`);
        populateRegions();

        // Create browsers
        try {
            await createBrowsers(config);
        } catch (err) {
            console.error("[LRV] Error creating browsers:", err);
            setStatus(`Error creating browsers: ${err.message}`);
            showLoading(false);
            return;
        }

        currentRegionIdx = -1;
        if (regions.length > 0) {
            navigateToRegion(0);
        }

        setStatus(`Loaded ${sampleId} — ${regions.length} region(s)`);
        showLoading(false);
    }

    async function destroyBrowsers() {
        for (const b of [refBrowser, hap1Browser, hap2Browser]) {
            if (b) {
                try { b.removeAllEventHandlers(); } catch(e) {}
                try { igv.removeBrowser(b); } catch(e) {}
            }
        }
        refBrowser = hap1Browser = hap2Browser = null;
        document.getElementById("igv-ref").innerHTML = "";
        document.getElementById("igv-hap1").innerHTML = "";
        document.getElementById("igv-hap2").innerHTML = "";
    }

    async function createBrowsers(config) {
        const baseUrl = window.location.origin;
        const readDisplayMode = displaySquished ? "SQUISHED" : "EXPANDED";

        // Resolve the CRAM decoding reference.  When the server provides
        // an explicit cram_ref, every CRAM track uses that FASTA for
        // decoding.  Otherwise we leave sequenceURL unset so igv.js falls
        // back to the browser-panel genome reference (which already carries
        // the .fai *and* .gzi indices).  Setting a redundant sequenceURL
        // creates a second IndexedFasta reader that may miss the .gzi
        // compressed index and attempt to download the entire bgzipped
        // reference into memory — the most likely cause of tab crashes.
        const cramRefUrl = config.cram_ref ? (baseUrl + config.cram_ref) : null;
        const cramRefIdxUrl = cramRefUrl ? (cramRefUrl + ".fai") : null;
        if (cramRefUrl) {
            console.log("[LRV] Using explicit cram_ref for CRAM decoding:", cramRefUrl);
        }

        // Helper: build an alignment track for reads (BAM or CRAM)
        function makeReadTrack(name, bamUrl, cramUrl, opts) {
            // If bamUrl actually points to a CRAM file, treat it as CRAM
            if (bamUrl && bamUrl.endsWith('.cram')) {
                cramUrl = cramUrl || bamUrl;
                bamUrl = null;
            }
            const isCram = !bamUrl && cramUrl;
            const url = isCram ? cramUrl : bamUrl;
            if (!url) return null;

            const track = {
                name: name,
                type: "alignment",
                format: isCram ? "cram" : "bam",
                url: baseUrl + url,
                indexURL: baseUrl + url + (isCram ? ".crai" : ".bai"),
                height: 120,
                displayMode: readDisplayMode,
                showSoftClips: false,
                hideSmallIndels: hideSmallIndels,
                smallIndelThreshold: 3,
                colorBy: "strand",
                ...opts,
            };
            // CRAM files require a reference FASTA for decoding.
            // When an explicit cram_ref is configured, use it.
            // Otherwise, let igv.js use the panel's genome reference
            // which already has proper .fai and .gzi indices loaded.
            if (isCram) {
                if (cramRefUrl) {
                    track.sequenceURL = cramRefUrl;
                    track.sequenceIndexURL = cramRefIdxUrl;
                    console.log(`[LRV] CRAM track "${name}": using explicit cram_ref`);
                } else {
                    console.log(`[LRV] CRAM track "${name}": using panel genome reference for decoding`);
                }
            }
            return track;
        }

        // Helper: build an alignment track for assembly cross-checks
        function makeAssemblyTrack(name, bamUrl, color) {
            if (!bamUrl) return null;
            return {
                name: name,
                type: "alignment",
                format: "bam",
                url: baseUrl + bamUrl,
                indexURL: baseUrl + bamUrl + ".bai",
                height: 60,
                color: color,
                displayMode: "SQUISHED",
                showSoftClips: false,
                hideSmallIndels: hideSmallIndels,
                smallIndelThreshold: 3,
            };
        }

        // ── Reference panel ──────────────────────────────────────────────
        const refOpts = {
            showNavigation: true,
            showCenterGuide: true,
            loadDefaultGenomes: false,
            genomeList: null,
            reference: {
                fastaURL: baseUrl + config.reference.fastaURL,
                indexURL: baseUrl + config.reference.fastaURL + ".fai",
                compressedIndexURL: baseUrl + config.reference.fastaURL + ".gzi",
            },
            tracks: [],
        };

        // Reads → Ref (BAM or CRAM)
        const readsRefTrack = makeReadTrack(
            "Reads → Ref",
            config.tracks.reads_bam,
            config.tracks.reads_cram,
            {}
        );
        if (readsRefTrack) refOpts.tracks.push(readsRefTrack);

        // Hap1 → Ref
        const hap1RefTrack = makeAssemblyTrack("Hap1 → Ref", config.tracks.hap1_to_ref_bam, "#4CAF50");
        if (hap1RefTrack) refOpts.tracks.push(hap1RefTrack);

        // Hap2 → Ref
        const hap2RefTrack = makeAssemblyTrack("Hap2 → Ref", config.tracks.hap2_to_ref_bam, "#FF9800");
        if (hap2RefTrack) refOpts.tracks.push(hap2RefTrack);

        // ── Hap1 panel ───────────────────────────────────────────────────
        const hap1Opts = {
            showNavigation: false,
            showCenterGuide: true,
            loadDefaultGenomes: false,
            genomeList: null,
            reference: {
                fastaURL: baseUrl + config.hap1_assembly.fastaURL,
                indexURL: baseUrl + config.hap1_assembly.fastaURL + ".fai",
                compressedIndexURL: baseUrl + config.hap1_assembly.fastaURL + ".gzi",
            },
            tracks: [],
        };

        // Reads → Hap1 (BAM or CRAM)
        const readsHap1Track = makeReadTrack(
            "Reads → Hap1",
            config.tracks.reads_to_hap1_bam,
            config.tracks.reads_to_hap1_cram,
            {}
        );
        if (readsHap1Track) hap1Opts.tracks.push(readsHap1Track);

        // Ref → Hap1
        const refHap1Track = makeAssemblyTrack("Ref → Hap1", config.tracks.ref_to_hap1_bam, "#2196F3");
        if (refHap1Track) hap1Opts.tracks.push(refHap1Track);

        // ── Hap2 panel ───────────────────────────────────────────────────
        const hap2Opts = {
            showNavigation: false,
            showCenterGuide: true,
            loadDefaultGenomes: false,
            genomeList: null,
            reference: {
                fastaURL: baseUrl + config.hap2_assembly.fastaURL,
                indexURL: baseUrl + config.hap2_assembly.fastaURL + ".fai",
                compressedIndexURL: baseUrl + config.hap2_assembly.fastaURL + ".gzi",
            },
            tracks: [],
        };

        // Reads → Hap2 (BAM or CRAM)
        const readsHap2Track = makeReadTrack(
            "Reads → Hap2",
            config.tracks.reads_to_hap2_bam,
            config.tracks.reads_to_hap2_cram,
            {}
        );
        if (readsHap2Track) hap2Opts.tracks.push(readsHap2Track);

        // Ref → Hap2
        const refHap2Track = makeAssemblyTrack("Ref → Hap2", config.tracks.ref_to_hap2_bam, "#2196F3");
        if (refHap2Track) hap2Opts.tracks.push(refHap2Track);

        // Pre-set initial loci and visibilityWindow from the first region so
        // browsers load the correct data immediately instead of the default
        // whole-chromosome view (~100 kb).  The visibilityWindow is derived
        // from the buffered view width so tracks only load what is displayed.
        if (regions.length > 0) {
            const r0 = regions[0];
            const { locus: r0Locus, viewWidth: r0Width } = computeBufferedLocus(r0);
            refOpts.locus = r0Locus;
            if (r0.hap1_regions && r0.hap1_regions.length > 0)
                hap1Opts.locus = r0.hap1_regions[0];
            if (r0.hap2_regions && r0.hap2_regions.length > 0)
                hap2Opts.locus = r0.hap2_regions[0];
            const widths = [r0Width];
            const hap1Width = parseLocusSpan(hap1Opts.locus);
            const hap2Width = parseLocusSpan(hap2Opts.locus);
            if (hap1Width) widths.push(hap1Width);
            if (hap2Width) widths.push(hap2Width);
            const initialVisibilityWindow = Math.max(...widths);
            // Apply region-derived visibilityWindow to every track in every panel
            for (const opts of [refOpts, hap1Opts, hap2Opts]) {
                for (const t of opts.tracks) {
                    t.visibilityWindow = initialVisibilityWindow;
                }
            }
        }

        // Create all three browsers
        console.log("[LRV] Creating IGV browsers...");
        console.log("[LRV] Ref panel tracks:", refOpts.tracks.length,
                     refOpts.tracks.map(t => `${t.name}(${t.format})`));
        console.log("[LRV] Hap1 panel tracks:", hap1Opts.tracks.length,
                     hap1Opts.tracks.map(t => `${t.name}(${t.format})`));
        console.log("[LRV] Hap2 panel tracks:", hap2Opts.tracks.length,
                     hap2Opts.tracks.map(t => `${t.name}(${t.format})`));

        [refBrowser, hap1Browser, hap2Browser] = await Promise.all([
            igv.createBrowser(document.getElementById("igv-ref"), refOpts),
            igv.createBrowser(document.getElementById("igv-hap1"), hap1Opts),
            igv.createBrowser(document.getElementById("igv-hap2"), hap2Opts),
        ]);

        console.log("[LRV] All IGV browsers created successfully");

        // Attach coordination listener to reference panel
        refBrowser.on("locuschange", onRefLocusChange);
    }

    // ── Coordinate translation & panel sync ─────────────────────────────────
    let translateTimeout = null;
    let activeTranslateCtrl = null;   // AbortController for in-flight translate fetch

    function onRefLocusChange(referenceFrameList) {
        if (!syncEnabled || translating) return;

        // Update locus display
        const locus = formatLocus(referenceFrameList);
        document.getElementById("refLocus").textContent = locus;

        // Cancel any in-flight translate request and reset the debounce.
        // This is the primary guard against concurrent syncs: each pan event
        // aborts the previous network call before scheduling a new one.
        if (activeTranslateCtrl) {
            activeTranslateCtrl.abort();
            activeTranslateCtrl = null;
        }
        if (translateTimeout) clearTimeout(translateTimeout);
        translateTimeout = setTimeout(() => translateAndSync(referenceFrameList), 500);
    }

    async function translateAndSync(referenceFrameList) {
        if (!currentSample || !syncEnabled || translating) return;

        // Capture generation so we can detect stale results.
        const gen = opGeneration;

        // Abort any previous in-flight request (safety net for back-to-back calls).
        if (activeTranslateCtrl) activeTranslateCtrl.abort();
        activeTranslateCtrl = new AbortController();
        const thisCtrl = activeTranslateCtrl;
        const { signal } = thisCtrl;

        const frame = referenceFrameList[0];
        if (!frame) return;

        const chrom = frame.chr;
        const start = Math.round(frame.start);
        const end = Math.round(frame.end);

        try {
            const resp = await fetch(
                `/api/translate?sample=${currentSample.sample_id}` +
                `&chrom=${encodeURIComponent(chrom)}&start=${start}&end=${end}`,
                { signal }
            );
            if (signal.aborted || gen !== opGeneration) return;
            const result = await resp.json();
            if (signal.aborted || gen !== opGeneration) return;
            const refSpan = computeInclusiveSpan(start, end) || 1;
            const translatedWidths = [refSpan];
            if (result.hap1 && result.hap1.length > 0) {
                translatedWidths.push(
                    computeInclusiveSpan(result.hap1[0].start, result.hap1[0].end) || 1
                );
            }
            if (result.hap2 && result.hap2.length > 0) {
                translatedWidths.push(
                    computeInclusiveSpan(result.hap2[0].start, result.hap2[0].end) || 1
                );
            }
            setVisibilityWindow(Math.max(...translatedWidths));

            // Set the flag *before* driving the hap browsers so that any
            // locuschange fired by their search() calls is ignored.
            // NOTE: we intentionally do NOT set translating=true before the
            // fetch above, because onRefLocusChange needs translating=false
            // to abort this request and queue an updated position if the user
            // keeps panning during the network round-trip.
            translating = true;

            // Navigate hap1 panel
            if (result.hap1 && result.hap1.length > 0 && hap1Browser) {
                const r = result.hap1[0];
                const locus = `${r.chrom}:${r.start}-${r.end}`;
                await hap1Browser.search(locus);
                if (gen !== opGeneration) return;
                document.getElementById("hap1Locus").textContent = locus;
            }

            // Navigate hap2 panel
            if (result.hap2 && result.hap2.length > 0 && hap2Browser) {
                const r = result.hap2[0];
                const locus = `${r.chrom}:${r.start}-${r.end}`;
                await hap2Browser.search(locus);
                if (gen !== opGeneration) return;
                document.getElementById("hap2Locus").textContent = locus;
            }

            translating = false;
        } catch (err) {
            translating = false;
            if (err.name !== "AbortError") {
                console.warn("Translation error:", err);
            }
        } finally {
            // Only clear activeTranslateCtrl if this call is still the active
            // one; a newer call may have already replaced it.
            if (activeTranslateCtrl === thisCtrl) {
                activeTranslateCtrl = null;
            }
        }
    }

    function formatLocus(frames) {
        if (!frames || frames.length === 0) return "";
        const f = frames[0];
        return `${f.chr}:${Math.round(f.start).toLocaleString()}-${Math.round(f.end).toLocaleString()}`;
    }

    // ── Region navigation ───────────────────────────────────────────────────

    // Compute a buffered reference-panel locus for a region.
    // The buffer is proportional to the SV event size (region.size) so that
    // the view widens with larger events — no static maximum cap.
    //
    // When region.fasta_region is set the ref_region is a padded subregion
    // FASTA sequence name (toy-dataset style, e.g. "chr1:9319383-9349426").
    // In that case we navigate directly to the fasta_region string so that
    // IGV falls back to treating the full string as the chromosome name and
    // locates the toy FASTA sequence correctly.
    //
    // Returns { locus, viewWidth } where viewWidth is the bp span of the
    // buffered view — used to size visibilityWindow on all tracks.
    function computeBufferedLocus(region) {
        // Toy-dataset case: fasta_region is the FASTA sequence name (e.g.
        // "chr1:9319383-9349426").  Navigate directly to it without adding
        // extra buffer so IGV can match the full string as the chromosome.
        if (region.fasta_region) {
            const fm = region.fasta_region.match(/^(.+):(\d+)-(\d+)$/);
            if (fm) {
                const fastaStart = parseInt(fm[2], 10);
                const fastaEnd = parseInt(fm[3], 10);
                const fastaSpan = computeInclusiveSpan(fastaStart, fastaEnd);
                return {
                    locus: region.fasta_region,
                    viewWidth: fastaSpan || 1,
                };
            }
        }

        let refChrom, refStart, refEnd;
        if (region.ref_region) {
            const m = region.ref_region.match(/^(.+):(\d+)-(\d+)$/);
            if (m) {
                refChrom = m[1];
                refStart = parseInt(m[2], 10);
                refEnd = parseInt(m[3], 10);
            }
        }
        if (!refChrom) {
            refChrom = region.chrom;
            refStart = parseInt(region.start, 10);
            refEnd = parseInt(region.end, 10);
        }
        // Use the SV event size (displayed in the region navigator) as the
        // basis for the buffer, falling back to the ref-region span.
        // No maximum cap — the view intentionally scales with the event so
        // that reads spanning both breakpoints remain visible for any SV size.
        const svSize = region.size || (refEnd - refStart);
        const buffer = Math.max(svSize * REGION_BUFFER_MULTIPLIER, MIN_REGION_BUFFER);
        const bufferedStart = Math.max(0, refStart - buffer);
        const bufferedEnd = refEnd + buffer;
        return {
            locus: `${refChrom}:${bufferedStart}-${bufferedEnd}`,
            viewWidth: computeInclusiveSpan(bufferedStart, bufferedEnd) || 1,
        };
    }

    // Update visibilityWindow on every track in every panel to match the
    // current displayed region, so tracks load exactly what is shown.
    function setVisibilityWindow(width) {
        for (const browser of [refBrowser, hap1Browser, hap2Browser]) {
            if (!browser) continue;
            for (const tv of (browser.trackViews || [])) {
                if (tv.track) tv.track.visibilityWindow = width;
            }
        }
    }

    function populateRegions() {
        regionSelect.innerHTML = "";
        if (regions.length === 0) {
            const opt = document.createElement("option");
            opt.value = "";
            opt.textContent = "No regions loaded";
            regionSelect.appendChild(opt);
            regionCounter.textContent = "0/0";
            return;
        }
        regions.forEach((r, i) => {
            const opt = document.createElement("option");
            opt.value = i;
            opt.textContent = r.label;
            regionSelect.appendChild(opt);
        });
        regionCounter.textContent = `0/${regions.length}`;
    }

    async function navigateToRegion(idx) {
        if (idx < 0 || idx >= regions.length) return;
        cancelPendingOps();
        currentRegionIdx = idx;
        regionSelect.value = idx;
        regionCounter.textContent = `${idx + 1}/${regions.length}`;

        const region = regions[idx];
        setStatus(`Navigating to ${region.label}`);

        const gen = opGeneration;
        translating = true;
        try {
            // Navigate reference panel to the region with a dynamic buffer on each side.
            // Derive visibilityWindow from the buffered view width so every track
            // loads exactly what is displayed, no more.
            const { locus: refLocus, viewWidth } = computeBufferedLocus(region);
            const windowWidths = [viewWidth];
            const h1Window = region.hap1_regions && region.hap1_regions[0]
                ? parseLocusSpan(region.hap1_regions[0]) : null;
            const h2Window = region.hap2_regions && region.hap2_regions[0]
                ? parseLocusSpan(region.hap2_regions[0]) : null;
            if (h1Window) windowWidths.push(h1Window);
            if (h2Window) windowWidths.push(h2Window);
            let effectiveWindow = Math.max(...windowWidths);
            setVisibilityWindow(effectiveWindow);
            if (refBrowser) {
                await refBrowser.search(refLocus);
                if (gen !== opGeneration) return;
                document.getElementById("refLocus").textContent = refLocus;
            }

            // Navigate assembly panels using pre-computed regions if available
            const hasHap1 = region.hap1_regions && region.hap1_regions.length > 0;
            const hasHap2 = region.hap2_regions && region.hap2_regions.length > 0;

            if (hasHap1 && hap1Browser) {
                const h1 = region.hap1_regions[0];
                await hap1Browser.search(h1);
                if (gen !== opGeneration) return;
                document.getElementById("hap1Locus").textContent = h1;
            }
            if (hasHap2 && hap2Browser) {
                const h2 = region.hap2_regions[0];
                await hap2Browser.search(h2);
                if (gen !== opGeneration) return;
                document.getElementById("hap2Locus").textContent = h2;
            }

            // If either haplotype lacks pre-computed regions, use dynamic translation
            if ((!hasHap1 || !hasHap2) && currentSample && syncEnabled) {
                try {
                    const result = await fetchJSON(
                        `/api/translate?sample=${currentSample.sample_id}` +
                        `&chrom=${encodeURIComponent(region.chrom)}` +
                        `&start=${region.start}&end=${region.end}`
                    );
                    if (gen !== opGeneration) return;
                    const translatedWidths = [effectiveWindow];
                    if (!hasHap1 && result.hap1 && result.hap1.length > 0 && hap1Browser) {
                        const r = result.hap1[0];
                        const locus = `${r.chrom}:${r.start}-${r.end}`;
                        translatedWidths.push(computeInclusiveSpan(r.start, r.end) || 1);
                        await hap1Browser.search(locus);
                        if (gen !== opGeneration) return;
                        document.getElementById("hap1Locus").textContent = locus;
                    }
                    if (!hasHap2 && result.hap2 && result.hap2.length > 0 && hap2Browser) {
                        const r = result.hap2[0];
                        const locus = `${r.chrom}:${r.start}-${r.end}`;
                        translatedWidths.push(computeInclusiveSpan(r.start, r.end) || 1);
                        await hap2Browser.search(locus);
                        if (gen !== opGeneration) return;
                        document.getElementById("hap2Locus").textContent = locus;
                    }
                    const translatedWindow = Math.max(...translatedWidths);
                    if (translatedWindow > effectiveWindow) {
                        effectiveWindow = translatedWindow;
                        setVisibilityWindow(effectiveWindow);
                    }
                } catch (err) {
                    console.warn("Region translation error:", err);
                }
            }
        } finally {
            translating = false;
        }
    }

    // ── Event listeners ─────────────────────────────────────────────────────
    sampleSelect.addEventListener("change", () => loadSample(sampleSelect.value));

    regionSelect.addEventListener("change", () => {
        const idx = parseInt(regionSelect.value, 10);
        if (!isNaN(idx)) navigateToRegion(idx);
    });

    prevBtn.addEventListener("click", () => {
        if (currentRegionIdx > 0) navigateToRegion(currentRegionIdx - 1);
    });

    nextBtn.addEventListener("click", () => {
        if (currentRegionIdx < regions.length - 1) navigateToRegion(currentRegionIdx + 1);
    });

    syncToggle.addEventListener("change", () => {
        syncEnabled = syncToggle.checked;
    });

    // ── Display mode toggle ─────────────────────────────────────────────────
    // Update display properties on all alignment tracks in every panel.
    // Sets the property on both the track instance AND its config object so
    // that IGV.js rendering code picks up the new value regardless of which
    // property it reads internally.  After updating, each browser is forced
    // to fully re-render its tracks.
    function updateAllTrackDisplayModes() {
        const mode = displaySquished ? "SQUISHED" : "EXPANDED";
        for (const browser of [refBrowser, hap1Browser, hap2Browser]) {
            if (!browser) continue;
            for (const tv of browser.trackViews) {
                const t = tv.track;
                if (t && t.type === "alignment") {
                    t.displayMode = mode;
                    if (t.config) t.config.displayMode = mode;
                }
            }
            browser.updateViews();
        }
    }

    function updateAllTrackIndelDisplay() {
        for (const browser of [refBrowser, hap1Browser, hap2Browser]) {
            if (!browser) continue;
            for (const tv of browser.trackViews) {
                const t = tv.track;
                if (t && t.type === "alignment") {
                    t.hideSmallIndels = hideSmallIndels;
                    t.smallIndelThreshold = 3;
                    if (t.config) {
                        t.config.hideSmallIndels = hideSmallIndels;
                        t.config.smallIndelThreshold = 3;
                    }
                }
            }
            browser.updateViews();
        }
    }

    toggleDisplayModeBtn.addEventListener("click", () => {
        displaySquished = !displaySquished;
        toggleDisplayModeBtn.innerHTML = displaySquished
            ? '<span class="btn-icon">☰</span> Squished'
            : '<span class="btn-icon">≡</span> Expanded';
        toggleDisplayModeBtn.classList.toggle("active", !displaySquished);
        updateAllTrackDisplayModes();
    });

    toggleSmallIndelsBtn.addEventListener("click", () => {
        hideSmallIndels = !hideSmallIndels;
        toggleSmallIndelsBtn.classList.toggle("active", hideSmallIndels);
        toggleSmallIndelsBtn.innerHTML = hideSmallIndels
            ? '<span class="btn-icon">🧹</span> Hide indels'
            : '<span class="btn-icon">🔍</span> Show indels';
        updateAllTrackIndelDisplay();
    });

    // ── Read ID comparison ──────────────────────────────────────────────────

    // Extract read names from the "Reads → …" alignment track in a browser.
    // Only considers read tracks (name starting with "Reads"), not assembly
    // alignment tracks, so the comparison reflects actual sequenced reads.
    async function collectReadNames(browser) {
        const names = new Set();
        if (!browser) return names;
        for (const tv of browser.trackViews) {
            const track = tv.track;
            if (!track || track.type !== "alignment") continue;
            if (!track.name || !track.name.startsWith("Reads")) continue;

            // Attempt to read from cached alignment containers first.
            // IGV.js stores these after rendering the visible region.
            try {
                const containers = track.alignmentContainers;
                if (containers && containers.length > 0) {
                    for (const ac of containers) {
                        if (!ac || !ac.alignments) continue;
                        for (const a of ac.alignments) {
                            if (a.readName) names.add(a.readName);
                        }
                    }
                    if (names.size > 0) continue;
                }
            } catch (_) { /* fall through */ }

            // Fallback: fetch from the featureSource for the current viewport.
            try {
                const refFrame = browser.referenceFrameList && browser.referenceFrameList[0];
                if (!refFrame) continue;
                const chr = refFrame.chr;
                const start = Math.floor(refFrame.start);
                const end = Math.ceil(refFrame.end);
                const fs = track.featureSource;
                if (!fs) continue;
                // Try getAlignments (IGV.js ≥3.x alignment source)
                if (typeof fs.getAlignments === "function") {
                    const ac = await fs.getAlignments(chr, start, end);
                    if (ac && ac.alignments) {
                        for (const a of ac.alignments) {
                            if (a.readName) names.add(a.readName);
                        }
                    }
                } else if (typeof fs.getFeatures === "function") {
                    const feats = await fs.getFeatures({chr, start, end});
                    if (Array.isArray(feats)) {
                        for (const f of feats) {
                            if (f.readName) names.add(f.readName);
                        }
                    }
                }
            } catch (e) {
                console.warn("[LRV] Could not fetch reads from", track.name, e);
            }
        }
        return names;
    }

    function renderReadCompare(refReads, hap1Reads, hap2Reads) {
        const MAX_DISPLAYED_READS = 200;
        // Compute set categories
        const all3 = [];
        const refHap1Only = [];
        const refHap2Only = [];
        const hap1Hap2Only = [];
        const refOnly = [];
        const hap1Only = [];
        const hap2Only = [];
        const allNames = new Set([...refReads, ...hap1Reads, ...hap2Reads]);

        for (const name of allNames) {
            const inRef = refReads.has(name);
            const inH1 = hap1Reads.has(name);
            const inH2 = hap2Reads.has(name);
            if (inRef && inH1 && inH2)        all3.push(name);
            else if (inRef && inH1)            refHap1Only.push(name);
            else if (inRef && inH2)            refHap2Only.push(name);
            else if (inH1 && inH2)             hap1Hap2Only.push(name);
            else if (inRef)                    refOnly.push(name);
            else if (inH1)                     hap1Only.push(name);
            else if (inH2)                     hap2Only.push(name);
        }

        const rows = [
            { label: "All three panels",              count: all3.length,        reads: all3,        cls: "" },
            { label: "Ref ∩ Hap1 only",               count: refHap1Only.length, reads: refHap1Only, cls: "" },
            { label: "Ref ∩ Hap2 only",               count: refHap2Only.length, reads: refHap2Only, cls: "" },
            { label: "Hap1 ∩ Hap2 only",              count: hap1Hap2Only.length,reads: hap1Hap2Only,cls: "" },
            { label: "Ref only",                       count: refOnly.length,     reads: refOnly,     cls: "" },
            { label: "Hap1 only",                      count: hap1Only.length,    reads: hap1Only,    cls: "" },
            { label: "Hap2 only",                      count: hap2Only.length,    reads: hap2Only,    cls: "" },
        ];

        let html = `<table>
            <tr><th colspan="2" style="padding-bottom:4px">Panel totals</th></tr>
            <tr><td>Reference</td><td class="count">${refReads.size}</td></tr>
            <tr><td>Haplotype 1</td><td class="count">${hap1Reads.size}</td></tr>
            <tr><td>Haplotype 2</td><td class="count">${hap2Reads.size}</td></tr>
            <tr><td><strong>Union (unique)</strong></td><td class="count"><strong>${allNames.size}</strong></td></tr>
        </table>
        <table style="margin-top:14px">
            <tr><th>Category</th><th style="text-align:right">Count</th></tr>`;
        for (const r of rows) {
            const pct = allNames.size > 0 ? ((r.count / allNames.size) * 100).toFixed(1) : "0.0";
            html += `<tr>
                <td>${r.label}</td>
                <td class="count">${r.count} <span style="color:var(--text-muted)">(${pct}%)</span></td>
            </tr>`;
            if (r.reads.length > 0) {
                const sorted = r.reads.slice().sort();
                const preview = sorted.slice(0, MAX_DISPLAYED_READS).join("\n");
                const more = sorted.length > MAX_DISPLAYED_READS ? `\n… and ${sorted.length - MAX_DISPLAYED_READS} more` : "";
                html += `<tr><td colspan="2">
                    <details><summary>Show read names</summary>
                    <div class="read-list">${escapeHtml(preview + more)}</div>
                    </details>
                </td></tr>`;
            }
        }
        html += `</table>`;
        html += `<p class="note">
            <strong>Sanity check:</strong> reads aligned to all three panels confirm that the
            reference, hap1, and hap2 regions overlap the same genomic locus.
            Reads appearing in only one or two panels may indicate region boundary
            differences or mapping-quality filtering.
        </p>`;
        return html;
    }

    function escapeHtml(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    compareReadsBtn.addEventListener("click", async () => {
        readCompareModal.classList.remove("hidden");
        readCompareBody.innerHTML = "Analyzing read IDs from all panels…";
        try {
            const [refReads, hap1Reads, hap2Reads] = await Promise.all([
                collectReadNames(refBrowser),
                collectReadNames(hap1Browser),
                collectReadNames(hap2Browser),
            ]);
            if (refReads.size === 0 && hap1Reads.size === 0 && hap2Reads.size === 0) {
                readCompareBody.innerHTML =
                    "<p>No reads found in any panel. Navigate to a region first " +
                    "and ensure the alignment data has loaded.</p>";
            } else {
                readCompareBody.innerHTML = renderReadCompare(refReads, hap1Reads, hap2Reads);
            }
        } catch (err) {
            readCompareBody.innerHTML = `<p>Error collecting reads: ${escapeHtml(err.message)}</p>`;
            console.error("[LRV] Read comparison error:", err);
        }
    });

    readCompareClose.addEventListener("click", () => {
        readCompareModal.classList.add("hidden");
    });
    readCompareModal.addEventListener("click", (e) => {
        if (e.target === readCompareModal) readCompareModal.classList.add("hidden");
    });

    // ── Dot Plot ────────────────────────────────────────────────────────────

    // Colour palette following wotplot conventions (Fedarko 2023).
    // Forward matches in blue, RC in red, palindromes in dark purple.
    const DOTPLOT_COLORS = {
        forward: "#2563eb",       // blue-600
        reverse: "#dc2626",       // red-600
        palindrome: "#7c3aed",    // violet-600
    };

    // Canvas rendering size (CSS pixels).  Actual backing pixels use
    // devicePixelRatio for crispness on high-DPI displays.
    const DOTPLOT_CANVAS_SIZE = 320;

    function getBrowserLocus(browser) {
        if (!browser) return null;
        const rf = browser.referenceFrameList && browser.referenceFrameList[0];
        if (!rf) return null;
        const chr = rf.chr;
        const start = Math.round(rf.start);
        const end = Math.round(rf.end);
        if (!chr || !Number.isFinite(start) || !Number.isFinite(end)) return null;
        return `${chr}:${start}-${end}`;
    }

    function renderDotPlotCanvas(canvas, data, xLabel, yLabel) {
        /**
         * Render a single dot plot onto an HTML5 Canvas element.
         *
         * Layout:
         *   ┌──────────────────────────────────────┐
         *   │  margin-top (axis label space)        │
         *   │   ┌─────────────────────────────┐     │
         *   │   │       dot plot area          │     │
         *   │   │                              │     │
         *   │   │                              │     │
         *   │   │                              │     │
         *   │   └─────────────────────────────┘     │
         *   │  margin-bottom (x-axis ticks)         │
         *   └──────────────────────────────────────┘
         */
        const dpr = window.devicePixelRatio || 1;
        const cssSize = DOTPLOT_CANVAS_SIZE;
        const margin = { top: 6, right: 6, bottom: 42, left: 50 };
        const totalW = cssSize;
        const totalH = cssSize;
        const plotW = totalW - margin.left - margin.right;
        const plotH = totalH - margin.top - margin.bottom;

        canvas.style.width = totalW + "px";
        canvas.style.height = totalH + "px";
        canvas.width = totalW * dpr;
        canvas.height = totalH * dpr;

        const ctx = canvas.getContext("2d");
        ctx.scale(dpr, dpr);
        ctx.clearRect(0, 0, totalW, totalH);

        // Background for plot area
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(margin.left, margin.top, plotW, plotH);

        const s1Len = data.seq1_len;
        const s2Len = data.seq2_len;

        if (s1Len === 0 || s2Len === 0) {
            ctx.fillStyle = "#9ca3af";
            ctx.font = "11px -apple-system, sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("No sequence data", totalW / 2, totalH / 2);
            return;
        }

        // Scale factors: x-axis is seq1 (horizontal), y-axis is seq2 (vertical, top-to-bottom)
        const xScale = plotW / s1Len;
        const yScale = plotH / s2Len;

        // Determine marker size based on data density
        const maxDim = Math.max(s1Len, s2Len);
        let markerSize;
        if (maxDim < 1000) markerSize = 2.5;
        else if (maxDim < 10000) markerSize = 1.5;
        else if (maxDim < 50000) markerSize = 0.8;
        else markerSize = 0.4;

        // Draw matches (back-to-front: palindromes first, then RC, then forward)
        const layers = [
            { key: "palindrome", color: DOTPLOT_COLORS.palindrome },
            { key: "reverse",    color: DOTPLOT_COLORS.reverse },
            { key: "forward",    color: DOTPLOT_COLORS.forward },
        ];
        for (const layer of layers) {
            const pts = data[layer.key];
            if (!pts || pts.length === 0) continue;
            ctx.fillStyle = layer.color;
            ctx.globalAlpha = 0.6;
            for (let i = 0; i < pts.length; i++) {
                const px = margin.left + pts[i][0] * xScale;
                const py = margin.top + pts[i][1] * yScale;
                ctx.fillRect(px, py, Math.max(markerSize, xScale), Math.max(markerSize, yScale));
            }
        }
        ctx.globalAlpha = 1.0;

        // Plot border
        ctx.strokeStyle = "#d1d5db";
        ctx.lineWidth = 1;
        ctx.strokeRect(margin.left, margin.top, plotW, plotH);

        // Axis ticks and labels
        ctx.fillStyle = "#6b7280";
        ctx.strokeStyle = "#d1d5db";
        ctx.lineWidth = 0.5;
        ctx.font = "9px -apple-system, sans-serif";

        // X-axis ticks (seq1)
        const nTicks = 5;
        ctx.textAlign = "center";
        for (let t = 0; t <= nTicks; t++) {
            const frac = t / nTicks;
            const px = margin.left + frac * plotW;
            const val = Math.round(frac * s1Len);
            // Tick mark
            ctx.beginPath();
            ctx.moveTo(px, margin.top + plotH);
            ctx.lineTo(px, margin.top + plotH + 4);
            ctx.stroke();
            // Label
            ctx.fillText(_formatBpLabel(val), px, margin.top + plotH + 14);
        }

        // Y-axis ticks (seq2)
        ctx.textAlign = "right";
        for (let t = 0; t <= nTicks; t++) {
            const frac = t / nTicks;
            const py = margin.top + frac * plotH;
            const val = Math.round(frac * s2Len);
            ctx.beginPath();
            ctx.moveTo(margin.left, py);
            ctx.lineTo(margin.left - 4, py);
            ctx.stroke();
            ctx.fillText(_formatBpLabel(val), margin.left - 6, py + 3);
        }

        // Axis titles
        ctx.fillStyle = "#374151";
        ctx.font = "bold 9px -apple-system, sans-serif";
        // X-axis title
        ctx.textAlign = "center";
        const xTitle = _truncLabel(xLabel, 40);
        ctx.fillText(xTitle, margin.left + plotW / 2, totalH - 2);
        // Y-axis title (rotated)
        ctx.save();
        ctx.translate(10, margin.top + plotH / 2);
        ctx.rotate(-Math.PI / 2);
        ctx.textAlign = "center";
        const yTitle = _truncLabel(yLabel, 40);
        ctx.fillText(yTitle, 0, 0);
        ctx.restore();
    }

    function _formatBpLabel(bp) {
        if (bp >= 1000000) return (bp / 1000000).toFixed(1) + "M";
        if (bp >= 1000) return (bp / 1000).toFixed(1) + "k";
        return String(bp);
    }

    function _truncLabel(s, maxLen) {
        if (!s) return "";
        return s.length > maxLen ? s.slice(0, maxLen - 1) + "…" : s;
    }

    function renderDotPlots(result) {
        const html = [];
        html.push('<div class="dotplot-grid">');

        const comparisons = [
            { key: "hap1_vs_ref",  title: "Hap1 vs Reference",    xLabel: result.labels.ref,  yLabel: result.labels.hap1 },
            { key: "hap2_vs_ref",  title: "Hap2 vs Reference",    xLabel: result.labels.ref,  yLabel: result.labels.hap2 },
            { key: "hap1_vs_hap2", title: "Hap1 vs Hap2",         xLabel: result.labels.hap1, yLabel: result.labels.hap2 },
        ];

        for (const c of comparisons) {
            const d = result[c.key];
            const total = (d.forward?.length || 0) + (d.reverse?.length || 0) + (d.palindrome?.length || 0);
            const trunc = d.truncated ? ' <span style="color:#dc2626">(truncated)</span>' : "";
            html.push(`<div class="dotplot-cell">
                <h3>${escapeHtml(c.title)}</h3>
                <canvas id="dp_${c.key}" width="320" height="320"></canvas>
                <div class="dotplot-info">
                    ${_formatBpLabel(d.seq1_len)} × ${_formatBpLabel(d.seq2_len)} &nbsp;|&nbsp;
                    ${total.toLocaleString()} matches (k=${result.k})${trunc}
                </div>
            </div>`);
        }

        html.push("</div>");
        // Legend
        html.push(`<div class="dotplot-legend">
            <div class="dotplot-legend-item">
                <div class="dotplot-legend-swatch" style="background:${DOTPLOT_COLORS.forward}"></div>
                Forward match
            </div>
            <div class="dotplot-legend-item">
                <div class="dotplot-legend-swatch" style="background:${DOTPLOT_COLORS.reverse}"></div>
                Reverse complement
            </div>
            <div class="dotplot-legend-item">
                <div class="dotplot-legend-swatch" style="background:${DOTPLOT_COLORS.palindrome}"></div>
                Palindrome
            </div>
        </div>`);
        // Citation
        html.push(`<div class="dotplot-citation">
            Dot plot algorithm based on
            <a href="https://github.com/fedarko/wotplot" target="_blank" rel="noopener">wotplot</a>
            (Fedarko, 2023.
            <a href="https://doi.org/10.21105/joss.06012" target="_blank" rel="noopener">JOSS 8(92), 6012</a>).
        </div>`);

        dotPlotBody.innerHTML = html.join("\n");

        // Render canvases after DOM insertion
        for (const c of comparisons) {
            const canvas = document.getElementById("dp_" + c.key);
            if (canvas) renderDotPlotCanvas(canvas, result[c.key], c.xLabel, c.yLabel);
        }
    }

    async function runDotPlot() {
        if (!currentSample) {
            dotPlotBody.innerHTML = "<p>No sample loaded.</p>";
            return;
        }

        const refLocus = getBrowserLocus(refBrowser);
        const hap1Locus = getBrowserLocus(hap1Browser);
        const hap2Locus = getBrowserLocus(hap2Browser);

        if (!refLocus && !hap1Locus && !hap2Locus) {
            dotPlotBody.innerHTML = "<p>Navigate to a region first.</p>";
            return;
        }

        const k = parseInt(dotPlotKInput.value, 10) || 31;
        dotPlotStatus.textContent = "Computing…";
        dotPlotRunBtn.disabled = true;

        try {
            const params = new URLSearchParams({
                sample: currentSample.sample_id,
                k: String(k),
            });
            if (refLocus) params.set("ref", refLocus);
            if (hap1Locus) params.set("hap1", hap1Locus);
            if (hap2Locus) params.set("hap2", hap2Locus);

            const resp = await fetch("/api/dotplot?" + params.toString());
            const result = await resp.json();

            if (result.error) {
                dotPlotBody.innerHTML = `<p>Error: ${escapeHtml(result.error)}</p>`;
                dotPlotStatus.textContent = "Error";
            } else {
                renderDotPlots(result);
                dotPlotStatus.textContent = "Done";
            }
        } catch (err) {
            dotPlotBody.innerHTML = `<p>Error: ${escapeHtml(err.message)}</p>`;
            dotPlotStatus.textContent = "Error";
            console.error("[LRV] Dot plot error:", err);
        } finally {
            dotPlotRunBtn.disabled = false;
        }
    }

    dotPlotBtn.addEventListener("click", () => {
        dotPlotModal.classList.remove("hidden");
    });

    dotPlotRunBtn.addEventListener("click", runDotPlot);

    dotPlotClose.addEventListener("click", () => {
        dotPlotModal.classList.add("hidden");
    });
    dotPlotModal.addEventListener("click", (e) => {
        if (e.target === dotPlotModal) dotPlotModal.classList.add("hidden");
    });

    // Keyboard shortcuts
    document.addEventListener("keydown", (e) => {
        // Close modals on Escape
        if (e.key === "Escape") {
            if (!readCompareModal.classList.contains("hidden")) {
                readCompareModal.classList.add("hidden");
                return;
            }
            if (!dotPlotModal.classList.contains("hidden")) {
                dotPlotModal.classList.add("hidden");
                return;
            }
        }
        if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
        if (e.key === "ArrowLeft" || e.key === "[") {
            e.preventDefault();
            prevBtn.click();
        } else if (e.key === "ArrowRight" || e.key === "]") {
            e.preventDefault();
            nextBtn.click();
        }
    });

    // ── Start ───────────────────────────────────────────────────────────────
    setInitialPanelHeights();
    setupPanelResizer(splitterRefHap1, refPanel, hap1Panel);
    setupPanelResizer(splitterHap1Hap2, hap1Panel, hap2Panel);
    init().catch(err => {
        setStatus("Error: " + err.message);
        showLoading(false);
        console.error(err);
    });
})();
</script>
</body>
</html>
